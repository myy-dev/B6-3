{% extends "base.html" %}
{% block title %}회원가입 — FlowTask{% endblock %}
{% block content %}
<section class="auth-shell">
  <div class="auth-intro">
    <p class="eyebrow">START YOUR FLOW</p>
    <h1>작은 계획부터<br>완료까지.</h1>
    <p>비밀번호는 단방향 해시로 안전하게 저장되며, 가입 즉시 나만의 워크스페이스가 열립니다.</p>
  </div>
  <div class="auth-card">
    <h2>회원가입</h2>
    <p class="muted">새 계정을 만들어 시작하세요.</p>
    {% if error %}<div class="form-error" role="alert">{{ error }}</div>{% endif %}
    <form action="/signup" method="post" class="stack-form">
      <input type="hidden" name="csrf" value="{{ csrf_token }}">
      <label>아이디<input name="username" value="{{ username|default('') }}" pattern="[A-Za-z0-9_]{3,50}" autocomplete="username" required><small>영문, 숫자, 밑줄 3자 이상</small></label>
      <label>표시 이름<input name="display_name" value="{{ display_name|default('') }}" minlength="2" maxlength="80" autocomplete="name" required></label>
      <label>비밀번호<input type="password" name="password" minlength="8" autocomplete="new-password" required><small>8자 이상</small></label>
      <button class="button button-primary button-full" type="submit">계정 만들기</button>
    </form>
    <p class="auth-switch">이미 계정이 있나요? <a href="/login">로그인</a></p>
  </div>
</section>
{% endblock %}
