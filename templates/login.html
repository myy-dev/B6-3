{% extends "base.html" %}
{% block title %}로그인 — FlowTask{% endblock %}
{% block content %}
<section class="auth-shell">
  <div class="auth-intro">
    <h1>흐름을 이어갈<br>시간입니다.</h1>
  </div>
  <div class="auth-card">
    <h2>로그인</h2>
    {% if error %}<div class="form-error" role="alert">{{ error }}</div>{% endif %}
    <form action="/login" method="post" class="stack-form">
      <input type="hidden" name="csrf" value="{{ csrf_token }}">
      <input type="hidden" name="next_url" value="{{ next_url }}">
      <label>아이디<input name="username" value="{{ username|default('') }}" autocomplete="username" required></label>
      <label>비밀번호<input type="password" name="password" autocomplete="current-password" required></label>
      <button class="button button-primary button-full" type="submit">로그인</button>
    </form>
    <div class="separator"><span>또는</span></div>
    <a class="button button-github button-full" href="/auth/github" rel="nofollow">GitHub로 계속하기</a>
    <p class="auth-switch"><a href="/signup">회원가입</a></p>
  </div>
</section>
{% endblock %}
