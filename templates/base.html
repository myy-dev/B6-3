<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="프로젝트의 흐름을 한눈에 관리하는 FlowTask">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/styles.css').path }}?v={{ styles_version }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="FlowTask 홈">
      <span class="brand-mark">F</span>
      <span>FlowTask</span>
    </a>
    <nav aria-label="주요 메뉴">
      {% if current_user %}
        <a href="/app/projects">내 프로젝트</a>
        <span class="welcome"><strong>{{ current_user.display_name }}</strong>님</span>
        <form action="/logout" method="post" class="inline-form">
          <input type="hidden" name="csrf" value="{{ csrf_token }}">
          <button class="button button-ghost button-small" type="submit">로그아웃</button>
        </form>
      {% else %}
        <a href="/login">로그인</a>
        <a class="button button-primary button-small" href="/signup">회원가입</a>
      {% endif %}
    </nav>
  </header>

  {% if flash %}
    <div class="flash flash-{{ flash.category }}" role="status">{{ flash.message }}</div>
  {% endif %}

  <main>{% block content %}{% endblock %}</main>

  <footer class="site-footer">
    <span>© myy-dev</span>
  </footer>
</body>
</html>
